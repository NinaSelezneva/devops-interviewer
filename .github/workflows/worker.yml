name: Deploy AI proxy to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'worker/**'
      - 'content/**'
      - 'scripts/build.mjs'
      - 'wrangler.toml'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Build content (generates server/questions.js)
        run: npm run build
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.148.0'
          # Имена переменных окружения шага, которые станут секретами Worker
          secrets: |
            LAMA_API
            LAMA_URL
            LAMA_MODEL
        env:
          LAMA_API: ${{ secrets.LAMA_API }}
          LAMA_URL: ${{ secrets.LAMA_URL }}
          LAMA_MODEL: ${{ secrets.LAMA_MODEL }}
